services:
  - type: web
    name: alpaca-dip-timing-web
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
  - type: worker
    name: alpaca-dip-timing-worker
    runtime: docker
    plan: starter
    dockerCommand: python -m app.worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_FEED
        value: sip
      - key: ALPACA_MARKET_DATA_RPM
        value: "60"
      - key: BOOTSTRAP_ITERATIONS
        value: "2000"
