services:
  - type: web
    name: alpaca-dip-timing-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: worker
    name: alpaca-dip-timing-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_FEED
        value: sip
      - key: ALPACA_MARKET_DATA_RPM
        value: "60"
      - key: WORKER_POLL_SECONDS
        value: "5"
      - key: STALE_WORK_MINUTES
        value: "15"
      - key: DEFAULT_COST_BPS
        value: 15,20,50
      - key: BOOTSTRAP_ITERATIONS
        value: "2000"
